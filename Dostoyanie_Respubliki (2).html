if(s.type==='text')body+=`<div class="prompt">${s.q}</div><input id="textanswer" type="text" placeholder="Например, 25.10.1990">`;
if(s.type==='creative')body+=`<div class="prompt">${s.q}</div><div class="creative-tools"><button type="button" data-insert="🇰🇿">🇰🇿 Символ</button><button type="button" data-insert="❤️">❤️ Сердце</button><button type="button" data-insert="🌱">🌱 Будущее</button><button type="button" data-insert="✨">✨ Надежда</button></div><textarea id="creativeanswer" placeholder="Моё послание Казахстану…"></textarea>`;
app.innerHTML=`<span class="pill">МИССИЯ ${i+1} ИЗ ${stations.length} · ${s.kind}</span><h2>${s.title}</h2><p class="muted">${s.intro}</p>${body}<div class="actions"><button class="primary" id="check">Проверить / завершить</button><button class="secondary" id="reset">Сбросить</button></div><div id="feedback"></div><div class="actions" id="nextrow"></div>`;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(checked)return;selected=+b.dataset.index;document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('selected',x===b))});
if(s.type==='match')setupMatch(s);
if(s.type==='order')setupOrder();if(s.type==='taporder')setupTapOrder();if(s.type==='memory')setupMemory(s);if(s.type==='move')setupMove(s);if(s.type==='word')setupWord(s);if(s.type==='wordhunt')setupWordHunt(s);if(s.type==='resource')setupResource(s);if(s.type==='lock')setupLock(s);
document.querySelectorAll('[data-insert]').forEach(b=>b.onclick=()=>{let t=document.getElementById('creativeanswer');t.value+=b.dataset.insert;t.focus()});
document.getElementById('check').onclick=()=>{if(checked)return;let ok=false,fb=document.getElementById('feedback');
if(s.type==='quiz'){if(selected===null){fb.className='feedback bad';fb.textContent='Сначала выбери ответ.';return}ok=selected===s.answer;document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===s.answer)b.classList.add('correct');else if(j===selected)b.classList.add('wrong')})}
else if(s.type==='match'){let zones=[...document.querySelectorAll('.dropzone')];if(zones.some(z=>!z.querySelector('[data-id]'))){fb.className='feedback bad';fb.textContent='Перетащи все карточки к подходящим целям.';return}ok=zones.every(z=>{let id=z.querySelector('[data-id]').dataset.id;return s.pairs.find(p=>p.id===id).target===z.dataset.target});zones.forEach(z=>z.querySelectorAll('.match-card').forEach(c=>c.draggable=false))}
else if(s.type==='order'){ok=order.every((x,j)=>s.items[j].id===x.id);document.querySelectorAll('.order-item button').forEach(b=>b.disabled=true)}
else if(s.type==='taporder'){ok=order.every((x,j)=>x.id===s.correct[j]);document.querySelectorAll('#orderlist button').forEach(b=>b.disabled=true)}
else if(s.type==='memory'){ok=window.memoryFound===3;if(!ok){fb.className='feedback bad';fb.textContent='Найди все три пары, прежде чем завершить миссию.';return}}
else if(s.type==='move'){ok=window.moveWon===true;if(!ok){fb.className='feedback bad';fb.textContent='Сначала доберись до 🏆 с помощью стрелок.';return}}
else if(s.type==='wordhunt'){ok=window.wordhuntSolved===4;if(!ok){fb.className='feedback bad';fb.textContent='Найди все четыре слова в буквенной сетке.';return}}
else if(s.type==='resource'){ok=window.resourceDone===true;if(!ok){fb.className='feedback bad';fb.textContent='Сначала выполни все три хода миссии.';return}}
else if(s.type==='lock'){ok=window.lockDone===true;if(!ok){fb.className='feedback bad';fb.textContent='Архив ещё закрыт. Реши все три загадки.';return}}
else if(s.type==='text'){let v=document.getElementById('textanswer').value.trim().toLowerCase().replace(/ё/g,'е');if(!v){fb.className='feedback bad';fb.textContent='Введи ответ.';return}ok=s.answer.some(a=>v===a.toLowerCase().replace(/ё/g,'е'))||v.includes('25')&&v.includes('10')&&v.includes('1990');document.getElementById('textanswer').disabled=true}
else{let v=document.getElementById('creativeanswer').value.trim();if(v.length<10){fb.className='feedback bad';fb.textContent='Напиши хотя бы одно содержательное предложение.';return}ok=true;document.getElementById('creativeanswer').disabled=true}
checked=true;fb.className='feedback '+(ok?'good':'bad');fb.innerHTML=(s.type==='creative'?'Послание принято! У творческой миссии нет единственного правильного ответа.':ok?'Верно! Отличная работа.':'Попробуй ещё раз вспомнить подсказки.')+' '+s.why;document.getElementById('nextrow').innerHTML=i<stations.length-1?`<button class="primary" onclick="go(${i+1})">Следующая миссия →</button>`:`<button class="primary" onclick="go(0)">Пройти квест ещё раз ↻</button>`};
document.getElementById('reset').onclick=render;document.getElementById('nav').innerHTML=stations.map((x,j)=>`<button class="${j===i?'active':''}" onclick="go(${j})">${j+1}. ${x.title}</button>`).join('');
}
function setupMatch(s){let selectedCard=null;const sources=document.getElementById('sources');function bindCards(){document.querySelectorAll('.match-card').forEach(c=>{c.addEventListener('dragstart',e=>{dragId=c.dataset.id;c.classList.add('dragging');e.dataTransfer.setData('text/plain',dragId)});c.addEventListener('dragend',()=>c.classList.remove('dragging'));c.addEventListener('click',()=>{selectedCard=c.dataset.id;document.querySelectorAll('.match-card').forEach(x=>x.style.outline=x.dataset.id===selectedCard?'2px solid var(--yellow)':'none')})})}
function bindZones(){document.querySelectorAll('.dropzone').forEach(z=>{z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});z.addEventListener('dragleave',()=>z.classList.remove('over'));z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');place(e.dataTransfer.getData('text/plain')||dragId,z)});z.addEventListener('click',()=>{if(selectedCard)place(selectedCard,z)})})}
function place(id,z){let card=document.querySelector(`.match-card[data-id="${id}"]`);if(!card)return;let old=card.parentElement;if(old.classList.contains('dropzone'))old.innerHTML='↘ Перетащи сюда <strong>'+old.dataset.target+'</strong>';z.innerHTML='';z.appendChild(card);selectedCard=null;bindCards();bindZones()}
bindCards();bindZones()}
function setupOrder(){let list=document.getElementById('orderlist'),dragged=null;function redraw(){list.innerHTML=order.map((x,j)=>`<div class="order-item" draggable="true" data-id="${x.id}"><span>${x.emoji}</span><strong>${x.label}</strong><button type="button" data-up="${j}">↑</button><button type="button" data-down="${j}">↓</button></div>`).join('');list.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let j=+b.dataset.up;if(j>0){[order[j-1],order[j]]=[order[j],order[j-1]];redraw()}});list.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{let j=+b.dataset.down;if(j<order.length-1){[order[j+1],order[j]]=[order[j],order[j+1]];redraw()}});list.querySelectorAll('.order-item').forEach(el=>{el.ondragstart=()=>{dragged=+order.findIndex(x=>x.id===el.dataset.id)};el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();let target=order.findIndex(x=>x.id===el.dataset.id);if(dragged!==null&&dragged!==target){let a=order.splice(dragged,1)[0];order.splice(target,0,a);redraw()}}})}redraw()}

function setupTapOrder(){function redraw(){let el=document.getElementById('orderlist');el.innerHTML=order.map((x,j)=>`<div class="order-item"><span>${x.emoji}</span><strong>${x.label}</strong><button type="button" data-up="${j}">↑</button><button type="button" data-down="${j}">↓</button></div>`).join('');el.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let j=+b.dataset.up;if(j>0){[order[j-1],order[j]]=[order[j],order[j-1]];redraw()}});el.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{let j=+b.dataset.down;if(j<order.length-1){[order[j+1],order[j]]=[order[j],order[j+1]];redraw()}})}redraw()}
function setupMemory(s){window.memoryFound=0;let open=[],found=[];document.querySelectorAll('[data-memory]').forEach(b=>b.onclick=()=>{let j=+b.dataset.memory;if(found.includes(j)||open.includes(j)||open.length===2)return;open.push(j);let c=s.cards[j];b.innerHTML=`<span style="font-size:2rem;display:block">${c[0]}</span>${c[1]}`;if(open.length===2){let [a,d]=open;if(s.cards[a][1]===s.cards[d][1]){found.push(a,d);window.memoryFound=found.length/2;document.getElementById('memoryhint').textContent=`Найдено пар: ${window.memoryFound} из 3`;open=[]}else{setTimeout(()=>{for(let k of open){let x=document.querySelector('[data-memory="'+k+'"]');if(x)x.innerHTML=`<span style="font-size:2rem;display:block">❔</span>Карточка ${k+1}`}open=[]},650)}}})}
function setupMove(s){window.moveWon=false;let pos=0;const blocked=new Set([2,6,8,13]);function draw(){document.querySelectorAll('[data-cell]').forEach(b=>{let j=+b.dataset.cell;let raw=s.map.join('').split('')[j];b.textContent=j===pos?'🧭':raw==='🏆'?'🏆':blocked.has(j)?'🪨':'·';b.style.borderColor=j===pos?'var(--yellow)':'#48556d'});document.getElementById('movehint').textContent=window.moveWon?'Сокровище найдено!':'Передвигайся по свободным клеткам.'}function move(dir){let r=Math.floor(pos/4),c=pos%4;if(dir==='up')r--;if(dir==='down')r++;if(dir==='left')c--;if(dir==='right')c++;if(r<0||r>3||c<0||c>3)return;let n=r*4+c;if(blocked.has(n))return;pos=n;if(n===15)window.moveWon=true;draw()}document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(b.dataset.move));document.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{let n=+b.dataset.cell;if(Math.abs(Math.floor(n/4)-Math.floor(pos/4))+Math.abs(n%4-pos%4)===1&&!blocked.has(n)){pos=n;if(n===15)window.moveWon=true;draw()}});draw()}

function setupWordHunt(s){let active=0,chosen=[],solved=new Set(),used=new Set();window.wordhuntSolved=0;const answer=document.getElementById('wordanswer');function draw(){answer.textContent=chosen.map(j=>s.letters[j]).join('')||'—';document.querySelectorAll('[data-letter]').forEach(b=>{let j=+b.dataset.letter;b.disabled=used.has(j)||chosen.includes(j);b.style.opacity=(used.has(j)||chosen.includes(j))?'.3':'1'});document.querySelectorAll('[data-targetword]').forEach(b=>{let j=+b.dataset.targetword;b.disabled=solved.has(j);b.innerHTML=s.targets[j]+(solved.has(j)?' <span>✓ найдено</span>':j===active?' <span class="muted">← собирай это</span>':' <span class="muted">· ожидает</span>')});document.getElementById('wordhint').textContent=`Собрано слов: ${solved.size} из 4`;document.getElementById('wordclear').disabled=chosen.length===0}
document.querySelectorAll('[data-targetword]').forEach(b=>b.onclick=()=>{let j=+b.dataset.targetword;if(!solved.has(j)){active=j;chosen=[];draw()}});
document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{let j=+b.dataset.letter;if(used.has(j)||chosen.includes(j))return;chosen.push(j);let now=chosen.map(k=>s.letters[k]).join('');if(now===s.targets[active]){chosen.forEach(k=>used.add(k));solved.add(active);window.wordhuntSolved=solved.size;let next=s.targets.findIndex((w,j)=>!solved.has(j));active=next<0?0:next;chosen=[]}draw()});
document.getElementById('wordclear').onclick=()=>{chosen=[];draw()};draw()}
function setupResource(s){let water=5,nature=5,budget=5,turn=0;window.resourceDone=false;function update(){document.getElementById('watermeter').textContent=water;document.getElementById('naturemeter').textContent=nature;document.getElementById('budgetmeter').textContent=budget;document.getElementById('roundhint').textContent=turn<3?`Ход ${turn+1} из 3`:'Все три хода выполнены';document.querySelectorAll('[data-action]').forEach(b=>b.disabled=turn>=3)}document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(turn>=3)return;let a=s.actions[+b.dataset.action];water=Math.max(0,Math.min(10,water+a.water));nature=Math.max(0,Math.min(10,nature+a.nature));budget=Math.max(0,Math.min(10,budget+a.budget));turn++;if(turn===3){window.resourceDone=true;let fb=document.getElementById('feedback');fb.className='feedback';fb.textContent=`Итог миссии — вода: ${water}, природа: ${nature}, бюджет: ${budget}. ${water>=6&&nature>=6?'Отличный результат — озеро под защитой!':'Решения приняты. Подумай, как можно улучшить результат в следующей попытке.'}`}update()});update()}
function setupLock(s){let step=0;window.lockDone=false;function draw(){let l=s.levels[step];document.getElementById('lockquestion').textContent=l.q;document.getElementById('lockoptions').innerHTML=l.options.map((o,j)=>`<button class="opt" data-lock="${j}">${o}</button>`).join('');document.getElementById('lockhint').textContent=`Этап ${step+1} из 3`;s.levels.forEach((_,j)=>{document.getElementById('lockstep'+j).textContent=j<step?'🔓 Этап '+(j+1):'🔒 Этап '+(j+1)});document.querySelectorAll('[data-lock]').forEach(b=>b.onclick=()=>{if(+b.dataset.lock===l.answer){step++;if(step>=s.levels.length){window.lockDone=true;document.getElementById('lockquestion').textContent='🎉 Архив открыт!';document.getElementById('lockoptions').innerHTML='<p class="feedback good">Все три загадки решены.</p>';document.getElementById('lockhint').textContent='Миссия пройдена';s.levels.forEach((_,j)=>document.getElementById('lockstep'+j).textContent='🔓 Этап '+(j+1))}else draw()}else{document.getElementById('lockhint').textContent='Не совсем! Подсказка: '+l.clue;b.classList.add('wrong')}})}draw()}
function setupWord(s){let chosen=[];const answer=document.getElementById('wordanswer');function redraw(){answer.textContent=chosen.map(j=>s.letters[j]).join('')||'—';document.querySelectorAll('[data-letter]').forEach(b=>{let j=+b.dataset.letter;b.disabled=chosen.includes(j);b.style.opacity=chosen.includes(j)?'.35':'1'})}document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{chosen.push(+b.dataset.letter);redraw()});document.getElementById('wordclear').onclick=()=>{chosen=[];redraw()}}
window.addEventListener('hashchange',render);if(!location.hash)location.hash='#station=1';render();
</script></body></html>
